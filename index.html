<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Bridge</title>
<style>
:root{--paper:#F2F5FA;--ink:#12305F;--line:#9FB3D1;--faint:#D3DEEC;--muted:#4F6B97;--mark:#B87300;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0E2347;--ink:#D6E8FF;--line:#37578F;--faint:#173463;--muted:#8FB0DE;--mark:#FFC857;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:15px/1.5 "Avenir Next",-apple-system,"Segoe UI",system-ui,sans-serif}
.box{max-width:26rem;padding:2rem;text-align:center}
h1{font:600 40px/1 "DIN Alternate","Avenir Next Condensed","Arial Narrow",sans-serif;margin:0 0 .5rem}
p{color:var(--muted);margin:.4rem 0}
.spin{width:34px;height:34px;margin:1.2rem auto;border:4px solid var(--faint);border-top-color:var(--mark);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
button{margin-top:1rem;padding:9px 16px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:inherit;font-weight:600;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="box">
  <h1>Bridge</h1>
  <div id="busy"><div class="spin"></div><p id="msg">Opening the model builder…</p></div>
  <div id="off" hidden>
    <p id="why"></p>
    <button id="retry" type="button">Try again</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const owner = location.hostname.split('.')[0];
const repo = location.pathname.split('/').filter(Boolean)[0] || '';
const code = decodeURIComponent((location.hash || '').replace(/^#(k=)?/, '')).trim();
const HOST_OK = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
let timer = 0;

function offline(text){
  $('busy').hidden = true; $('off').hidden = false; $('why').textContent = text;
  clearTimeout(timer); timer = setTimeout(go, 20000);
}
async function currentHost(){
  const stamp = Date.now();
  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/tunnel.json?t=${stamp}`, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
    if (r.ok) { const j = await r.json(); return JSON.parse(atob(j.content.replace(/\s/g, ''))).host || ''; }
  } catch {}
  try {
    const r = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/tunnel.json?t=${stamp}`, { cache: 'no-store' });
    if (r.ok) return (await r.json()).host || '';
  } catch {}
  return '';
}
async function reachable(host){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
  try { await fetch(host + '/share/health', { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }); return true; }
  catch { return false; } finally { clearTimeout(t); }
}
async function go(){
  clearTimeout(timer);
  $('off').hidden = true; $('busy').hidden = false; $('msg').textContent = 'Opening the model builder…';
  if (!code) { $('busy').hidden = true; $('off').hidden = false; $('why').textContent = 'This link is missing its access code. Ask your friend to send the full link again.'; $('retry').hidden = true; return; }
  const host = await currentHost();
  if (!HOST_OK.test(host)) return offline('The model builder is offline right now. The computer running it may be off or asleep. This page will try again by itself.');
  if (!(await reachable(host))) return offline('The model builder is starting up or offline. This page will try again by itself in a moment.');
  location.replace(host + '/?k=' + encodeURIComponent(code));
}
$('retry').addEventListener('click', go);
go();
</script>
</body>
</html>
